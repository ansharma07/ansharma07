name: Generate profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: dist/snake.svg?palette=github-dark

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stats card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=ansharma07&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false" -o stats.svg

      - name: Push stats.svg to stats-output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan stats-output-tmp
          git rm -rf . --quiet || true
          mv stats.svg stats.svg
          git add stats.svg
          git commit -m "Update stats.svg"
          git push -f origin stats-output-tmp:stats-output

  languages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch languages card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=ansharma07&locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false" -o languages.svg

      - name: Push languages.svg to languages-output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan languages-output-tmp
          git rm -rf . --quiet || true
          mv languages.svg languages.svg
          git add languages.svg
          git commit -m "Update languages.svg"
          git push -f origin languages-output-tmp:languages-output
